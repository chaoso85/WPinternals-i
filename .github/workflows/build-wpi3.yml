name: Build WPinternals 3.0

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (empty = this repo's current branch)"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build and publish (single file)
        shell: pwsh
        run: |
          msbuild /m /t:restore,wpinternals:publish /p:Platform=${{ matrix.architecture }} /p:RuntimeIdentifier=win-${{ matrix.architecture }} /p:PublishDir=${{ github.workspace }}/artifacts/win-${{ matrix.architecture }} /p:PublishSingleFile=true /p:PublishTrimmed=false WPinternals.sln

      - name: Show output
        shell: pwsh
        run: Get-ChildItem "${{ github.workspace }}/artifacts/win-${{ matrix.architecture }}" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WPinternals-win-${{ matrix.architecture }}
          path: ${{ github.workspace }}/artifacts/win-${{ matrix.architecture }}
          retention-days: 30
