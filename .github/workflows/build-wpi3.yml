name: Build WPinternals 3.0 (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (default: pinned commit d270cac, Apr 2026)"
        required: false
        default: "d270cace796bfe74d1719ba3201bddadb3c508dd"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Remove prerelease timebomb (Registration.ExpirationDate)
        shell: pwsh
        run: |
          $f = "WPinternals/Config/Registration.cs"
          $src = Get-Content $f -Raw
          $new = $src -replace '(ExpirationDate\s*=\s*)new\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*\)', '${1}DateTime.MaxValue'
          if ($new -eq $src) { throw "Timebomb pattern not found in $f - check the file" }
          Set-Content -Path $f -Value $new -NoNewline -Encoding utf8BOM
          Select-String -Path $f -Pattern "ExpirationDate"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build and publish (single file)
        shell: pwsh
        run: |
          msbuild /m /t:restore,wpinternals:publish /p:Platform=${{ matrix.architecture }} /p:RuntimeIdentifier=win-${{ matrix.architecture }} /p:PublishDir=${{ github.workspace }}/artifacts/win-${{ matrix.architecture }} /p:PublishSingleFile=true /p:PublishTrimmed=false WPinternals.sln

      - name: Show output
        shell: pwsh
        run: Get-ChildItem "${{ github.workspace }}/artifacts/win-${{ matrix.architecture }}" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WPinternals-win-${{ matrix.architecture }}
          path: ${{ github.workspace }}/artifacts/win-${{ matrix.architecture }}
          retention-days: 30
